# 应用配置
app:
  name: blog-system
  port: ":8080"
  mode: debug  # debug, release, test

# 数据库配置
database:
  driver: sqlite  # sqlite, mysql
  dsn: blog.db    # SQLite: 文件路径, MySQL: DSN字符串

# Redis配置 (可选，不配置则使用内存缓存)
redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

# JWT配置
jwt:
  secret: your-secret-key-change-in-production
  expiration: 24  # Token有效期(小时)
